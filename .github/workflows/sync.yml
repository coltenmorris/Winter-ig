name: Daily Instagram sync

on:
  schedule:
    - cron: "17 12 * * *"   # every day around 7am Eastern
  workflow_dispatch:         # lets you run it anytime from the Actions tab
  push:
    branches: [main]
    paths: [flags.json]      # rebuild the site when you tag an ad or trial reel

permissions:
  contents: write

concurrency:
  group: ig-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas python-dotenv

      - name: Pull Instagram stats
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python sync.py

      - name: Build website
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CREATOR_TAGLINE: ${{ vars.CREATOR_TAGLINE }}
          ACCOUNT_LOCATION: ${{ vars.ACCOUNT_LOCATION }}
          ACCOUNT_CREATED: ${{ vars.ACCOUNT_CREATED }}
        run: python build_site.py

      - name: Save database and website to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ig_analytics.db docs
          git diff --cached --quiet || git commit -m "Daily Instagram stats $(date -u +%F)"
          git pull --rebase -q || true
          git push
