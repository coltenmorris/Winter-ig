name: Diagnose Instagram data

on:
  workflow_dispatch:
    inputs:
      script:
        default: "diagnose_timeframes.py"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas python-dotenv
      - name: Ask Instagram for each metric
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python ${{ inputs.script || 'diagnose_timeframes.py' }}
