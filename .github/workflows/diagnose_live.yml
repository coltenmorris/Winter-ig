name: Check live follower updates

on:
  workflow_dispatch:
    inputs:
      minutes:
        default: "3"

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas python-dotenv
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python diagnose_live.py ${{ inputs.minutes || 3 }} 10
