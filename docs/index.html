<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Kit</title>
<meta name="description" content="Instagram creator media kit with audience and performance stats.">
<link rel="stylesheet" href="style.css?v=202611110401">
</head>
<body>
<div class="wrap">
  <nav class="top"><a href="index.html" data-p="kit">Media kit</a><a href="analytics.html" data-p="an">Analytics</a></nav>
  <main id="app"></main>
</div>
<script src="data.js?v=202611110401"></script>
<script>
if (!window.DATA || (!DATA.reels.length && !DATA.followers.length)) {
  document.addEventListener("DOMContentLoaded", () => {
    const main = document.querySelector("main#app") || document.querySelector(".wrap");
    const nav = document.querySelector("nav.top");
    main.innerHTML = (main.id === "app" ? "" : (nav ? nav.outerHTML : "")) +
      '<h1 style="font-size:clamp(2.6rem,7vw,5rem);line-height:.92;letter-spacing:-.05em">Media kit</h1>' +
      '<p class="lede" style="margin-top:18px">Stats will appear here after the first sync. Add the account\'s access token to the ' +
      'IG_ACCESS_TOKEN secret on GitHub, then run Daily Instagram sync from the Actions tab.</p>';
  });
  window.__EMPTY = true;
}
</script>
<script src="common.js?v=202611110401"></script>
<script>
if (!window.__EMPTY) {
mark("kit");
const P = D.profile, R = D.reels.filter(r => r.kind !== "post" && !r.ad), ADS = D.reels.filter(r => r.ad);
const now = Date.now(), DAY = 864e5;
const followers = D.followers.length ? D.followers[D.followers.length - 1].n : null;
const recent = R.filter(r => (now - dt(r.posted)) / DAY <= 90 && (now - dt(r.posted)) / DAY >= 3);
const pool = recent.length >= 3 ? recent : R;
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const mains = pool.map(r => val(r)).filter(v => v != null);
const engs = pool.map(r => r.total && r.total.engagement).filter(v => v != null);
// The same figures as they stood a month ago: reels posted 30+ days ago, same window rules.
const ageAt = (r, back) => (now - dt(r.posted)) / DAY - back;
const thenR = R.filter(r => ageAt(r, 30) >= 0);
const thenRecent = thenR.filter(r => ageAt(r, 30) <= 90 && ageAt(r, 30) >= 3);
const thenPool = thenRecent.length >= 3 ? thenRecent : thenR;
const prevMain = avg(thenPool.map(r => val(r)).filter(v => v != null));
const prevEng = avg(thenPool.map(r => r.total && r.total.engagement).filter(v => v != null));
const lastMonth = (cur, prev, show) => (prev == null || cur == null) ? "" :
  `<div class="lm">${cur > prev ? '<span class="up" aria-label="up from last month">&#9650;</span>' : ""}Last month ${show(prev)}</div>`;
const total = R.map(r => val(r)).filter(v => v != null).reduce((s, x) => s + x, 0);
const first = R.length ? dt(R[R.length - 1].posted) : new Date();
const contact = D.contact ? `<a class="btn" href="mailto:${esc(D.contact)}?subject=${encodeURIComponent("Partnership with @" + P.username)}">Contact for partnerships</a>` : "";
const avatar = P.pic ? `<img class="avatar" src="${esc(P.pic)}" alt="" referrerpolicy="no-referrer">` : `<div class="avatar">${esc((P.name || P.username || "?")[0])}</div>`;

let html = `
<section class="hero">
  <div class="count glass"><span class="px"></span>
    <div class="n">${fmt(followers)}</div><div class="l">followers on Instagram</div>
    <div class="stripes short" style="margin-top:22px"></div></div>
  <div class="id glass">
    <h1>${esc(P.name || P.username)}</h1>
    <div class="stripes" style="margin-top:14px"></div>
    <div class="row"><span class="handle">@${esc(P.username)}</span>${avatar}</div>
    ${(D.tagline || P.bio) ? `<div class="bio">${esc(D.tagline || P.bio)}</div>` : ""}
    ${D.created ? `<div class="created">Account created ${esc(D.created)}</div>` : ""}
    ${contact}
  </div>
</section>
<div class="script">media kit</div>
<section class="board glass${D.views_30d != null ? " five" : ""}">
  <div><div class="v">${fmt(avg(mains))}</div><div class="k">Average ${MAIN_LABEL} per reel</div>${lastMonth(avg(mains), prevMain, fmt)}</div>
  ${engs.length ? `<div><div class="v">${pct(avg(engs))}</div><div class="k">Engagement rate</div>${lastMonth(avg(engs), prevEng, pct)}</div>`
               : `<div><div class="v">${R.length}</div><div class="k">Reels published</div></div>`}
  ${D.views_30d != null ? `<div><div class="v">${fmt(D.views_30d)}</div><div class="k">Views in the last 30 days</div></div>` : ""}
  <div><div class="v">${fmt(total)}</div><div class="k">Total ${MAIN_LABEL} across reels</div></div>
  <div><div class="v">${fmt(Math.max(...R.map(r => val(r) ?? 0)))}</div><div class="k">${MAIN_LABEL[0].toUpperCase() + MAIN_LABEL.slice(1)} on top reel</div></div>
</section>`;

// Audience: viewers this month or followers, with a switch
const AUD = D.audiences || (Object.keys(D.demographics || {}).length ? { [D.demo_source]: D.demographics } : {});
const AUD_PREV = D.audiences_prev || {};
const audNames = Object.keys(AUD).sort((a, b) => (a === "followers" ? -1 : 1));
let DN = null; try { DN = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}
const COUNTRY = new Proxy({}, { get: (_, k) => { try { return DN ? DN.of(k) : k; } catch (e) { return k; } } });
const sum = o => Object.values(o || {}).reduce((s, x) => s + x, 0);
// Instagram lists only the top 45 cities/countries, so shares use the whole audience (gender or age covers everyone).
const wholeOf = d => sum(d.gender) || sum(d.age);
const totalFor = (d, key) => (key === "city" || key === "country") && wholeOf(d) ? wholeOf(d) : sum(d[key]);
function renderAudience(name) {
  const demo = AUD[name], PREV = AUD_PREV[name] || {}, hasPrev = Object.keys(PREV).length > 0;
  const prevShare = (key, k) => { const t = totalFor(PREV, key); return t ? ((PREV[key] || {})[k] || 0) / t : 0; };
  // Month-over-month change in percentage points; green arrow only when it went up.
  const change = (p, key, k) => { if (!PREV[key]) return ""; const d = Math.round((p - prevShare(key, k)) * 100);
    return d > 0 ? `<span class="chg"><span class="up">&#9650;</span> +${d} pts</span>` : `<span class="chg">${d === 0 ? "no change" : d + " pts"}</span>`; };
  const bars = (obj, { sortByValue = true, top = 6, names = {}, key } = {}) => {
    let rows = Object.entries(obj); const tot = totalFor(demo, key), pv = PREV[key];
    rows = sortByValue ? rows.sort((a, b) => b[1] - a[1]).slice(0, top) : rows.sort();
    const peak = Math.max(...rows.map(r => r[1]));
    return `<div class="glass panel bars${pv ? " mom" : ""}">${rows.map(([k, v]) => `<div class="row"><span class="lbl">${esc((names[k] || k).split(",")[0])}</span>
      <span class="track"><span class="fill" style="display:block;width:${(v / peak * 100).toFixed(1)}%"></span></span><span class="pct">${v / tot < .005 ? "<1" : Math.round(v / tot * 100)}%</span>${change(v / tot, key, k)}</div>`).join("")}</div>`;
  };
  let h = `<p class="lede">${name === "viewers" ? `Everyone who viewed your posts and reels since ${esc(D.viewers_since || "tracking began")}, added up month by month (Instagram only reports viewers one month at a time).` : "Your followers, as reported by Instagram."}
    City and country shares are out of the whole audience; Instagram lists the top 45 of each.
    ${name !== "followers" ? "" : hasPrev ? `Changes compare with ${esc(D.demo_prev_month)}.` : "Month-over-month changes appear once last month's numbers are saved."}</p><div class="cols"><div>`;
  if (demo.age) h += `<h3>Age</h3>` + bars(demo.age, { sortByValue: false, key: "age" });
  if (demo.gender) {
    // Women / Men / Not specified, rounded so they add up to exactly 100
    const g = demo.gender, t = sum(g), parts = [["Women", "F", "var(--moss)"], ["Men", "M", "var(--fern)"], ["Not specified", "U", "var(--ivy)"]];
    const shares = parts.map(([, c]) => (g[c] || 0) / t), raw = shares.map(s => s * 100), pc = raw.map(Math.floor);
    raw.map((r, i) => [r - pc[i], i]).sort((a, b) => b[0] - a[0]).slice(0, 100 - pc.reduce((a, b) => a + b, 0)).forEach(([, i]) => pc[i]++);
    h += `<h3 style="margin-top:18px">Gender</h3><div class="glass panel"><div style="display:flex;height:8px;margin:6px 0 10px">
      ${parts.map(([, , col], i) => `<span style="width:${shares[i] * 100}%;background:${col}"></span>`).join("")}</div>
      <div class="na" style="font-size:.92rem;color:var(--stone)">${parts.map(([n, c, col], i) => `<span style="white-space:nowrap"><i style="display:inline-block;width:10px;height:10px;margin-right:6px;background:${col}"></i>${n} ${pc[i]}%${change(shares[i], "gender", c)}</span>`).join(" &nbsp; ")}</div>
      <p class="note">"Not specified" is people who haven't shared a gender with Instagram.</p></div>`;
  }
  h += `</div><div>`;
  if (demo.city) h += `<h3>Top cities</h3>` + bars(demo.city, { key: "city" });
  if (demo.country) h += `<h3 style="margin-top:18px">Top countries</h3>` + bars(demo.country, { top: 5, names: COUNTRY, key: "country" });
  document.getElementById("audbody").innerHTML = h + `</div></div>`;
  document.querySelectorAll("#audseg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.a === name));
}
if (audNames.length) {
  html += `<h2>Who's watching</h2>` + (audNames.length > 1 ? `<div class="seg" role="group" aria-label="Audience" id="audseg">${audNames.map(a =>
    `<button data-a="${a}" aria-pressed="false">${a === "viewers" ? "Viewers, all time" : "Followers"}</button>`).join("")}</div>` : "") + `<div id="audbody"></div>`;
}

// Top reels
const topReels = [...(recent.length >= 6 ? R.filter(r => (now - dt(r.posted)) / DAY <= 90) : R)]
  .filter(r => val(r) != null).sort((a, b) => val(b) - val(a)).slice(0, 6);
html += `<h2>Top reels</h2><p class="lede">Most-${HAS_VIEWS ? "viewed" : "liked"} reels${recent.length >= 6 ? " from the last 90 days" : ""}. Tap one for its numbers.</p>
<div class="reels">${topReels.map((r, i) => `<button class="reel" onclick="openReel('${r.id}')">${thumb(r, i === 0 ? '<span class="badge">Top reel</span>' : "")}
  <div class="card glass"><div class="meta"><div><b>${fmt(val(r))}</b><span>${MAIN_LABEL}</span></div>
  ${r.total.engagement != null ? `<div style="text-align:right"><b>${pct(r.total.engagement)}</b><span>engagement</span></div>`
                               : `<div style="text-align:right"><b>${fmt(r.total.comments)}</b><span>comments</span></div>`}</div>
  <div class="t">${esc(r.title)}, ${fmtDate(r.posted, { month: "short", day: "numeric", year: "numeric" })}</div></div></button>`).join("")}</div>`;

// Brand partnerships
if (ADS.length) {
  const aVals = ADS.map(r => val(r)).filter(v => v != null), aAvg = avg(aVals), oAvg = avg(R.map(r => val(r)).filter(v => v != null));
  const aEng = avg(ADS.map(r => r.total.engagement).filter(v => v != null));
  const brands = [...new Set(ADS.map(r => r.brand).filter(Boolean))];
  html += `<h2>Brand partnerships</h2><p class="lede">Sponsored posts and reels${brands.length ? " for " + brands.map(esc).join(", ") : ""}, and how they typically perform.</p>
  <section class="board glass" style="margin-top:8px">
    <div><div class="v">${ADS.length}</div><div class="k">Sponsored ${ADS.length === 1 ? "post" : "posts"}</div></div>
    <div><div class="v">${fmt(aAvg)}</div><div class="k">Average ${MAIN_LABEL} per ad</div>${oAvg ? `<div class="k" style="color:var(--fern);margin-top:4px">${aAvg >= oAvg ? "+" : ""}${Math.round((aAvg / oAvg - 1) * 100)}% vs. a typical reel</div>` : ""}</div>
    <div><div class="v">${aEng != null ? pct(aEng) : "n/a"}</div><div class="k">Average engagement on ads</div></div>
    <div><div class="v">${fmt(aVals.reduce((s, x) => s + x, 0))}</div><div class="k">Total ${MAIN_LABEL} delivered</div></div>
  </section>
  <div class="reels" style="margin-top:22px">${[...ADS].sort((a, b) => b.posted.localeCompare(a.posted)).map(r => `<button class="reel" onclick="openReel('${r.id}')">${thumb(r, r.brand ? `<span class="badge">${esc(r.brand)}</span>` : "")}
    <div class="card glass"><div class="meta"><div><b>${fmt(val(r))}</b><span>${MAIN_LABEL}</span></div>
    <div style="text-align:right"><b>${r.total.engagement != null ? pct(r.total.engagement) : "n/a"}</b><span>engagement</span></div></div>
    <div class="t">${esc(r.title)}, ${fmtDate(r.posted, { month: "short", day: "numeric", year: "numeric" })}</div></div></button>`).join("")}</div>`;
}

// Growth
if (D.followers.length > 1) {
  html += `<h2>Growth</h2><p class="lede">Follower count over time.</p><div class="glass panel">${lineChart(D.followers.map(f => [Date.parse(f.date), f.n]))}</div>`;
}
html += `<div class="foot">Numbers come directly from the Instagram API and update daily. Last updated ${esc(D.updated)}.</div>`;
document.getElementById("app").innerHTML = html;
if (audNames.length) {
  renderAudience(audNames[0]);
  const seg = document.getElementById("audseg");
  if (seg) seg.addEventListener("click", e => { const b = e.target.closest("button[data-a]"); if (b) renderAudience(b.dataset.a); });
}
}
</script>
</body>
</html>
